# Quarkus Application Configuration
quarkus.application.name=EvaluacionGabrielBorjaMoscoso
quarkus.http.port=8080
quarkus.http.test-port=0

# Database Configuration (MySQL)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=2468
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/transferencias_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# OpenAPI and Swagger UI Configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Sistema de Gestión de Transferencias Interbancarias API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST desarrollada en Java 17 con Quarkus y Hibernate ORM con Panache para la administración de cuentas bancarias y transferencias.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# CORS Configuration for Angular frontend
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, PATCH

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.evaluacion.gabrielborjamoscoso".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
